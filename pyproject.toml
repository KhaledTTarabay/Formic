[tool.poetry]
name = "formic"
version = "0.1.0"
description = "Agent-native bug tracker — structured tool calls instead of a browser."
authors = ["Khaled <khaledtarabay277@gmail.com>"]
readme = "README.md"
packages = [{ include = "formic"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
mcp = "^1.2.0"
typer = "^0.13.0"
asyncpg = "^0.30.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sentence-transformers = "^3.3.0"
pgvector = "^0.3.6"
torch = { version = "^2.5.0", source = "pytorch-cpu" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.scripts]
formic = "formic.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"